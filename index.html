<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>PageStep</title>
  <meta name="description" content="A calm, personal reading-habit tracker with progressive daily goals." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#6B9080" />

  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PageStep" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="app-title">PageStep</h1>
        <span id="header-level" class="level-chip" title="Your level">Lv 1</span>
      </div>
    </header>

    <!-- Views -->
    <main id="view" class="view"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-view="home" aria-label="Home">
        <svg viewBox="0 0 24 24" class="tab__icon"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-view="library" aria-label="Library">
        <svg viewBox="0 0 24 24" class="tab__icon"><path d="M5 4h9a2 2 0 0 1 2 2v14l-4-2-4 2V6a2 2 0 0 0-2-2H5zm14 0h.5A1.5 1.5 0 0 1 21 5.5V18l-2 1V4z"/></svg>
        <span>Library</span>
      </button>
      <button class="tab tab--primary" data-view="log" aria-label="Start reading">
        <svg viewBox="0 0 24 24" class="tab__icon"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"/></svg>
        <span>Read</span>
      </button>
      <button class="tab" data-view="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24" class="tab__icon"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
        <span>Progress</span>
      </button>
    </nav>
  </div>

  <!-- Celebration overlay -->
  <div id="celebrate" class="celebrate" hidden>
    <div class="celebrate__card">
      <div class="celebrate__emoji" id="celebrate-emoji">🎉</div>
      <h2 id="celebrate-title">Goal met!</h2>
      <p id="celebrate-body">Nice work today.</p>
      <button class="btn btn--primary" id="celebrate-close">Keep going</button>
    </div>
    <div class="confetti" id="confetti"></div>
  </div>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <!-- Toast host -->
  <div id="toast-root" class="toast-root"></div>

  <script src="./js/store.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/goals.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
